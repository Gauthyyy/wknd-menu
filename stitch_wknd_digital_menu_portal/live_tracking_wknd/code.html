<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WKND - Live Order Tracking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Work+Sans:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#201c00",
                        "on-secondary-container": "#716500",
                        "surface-variant": "#333535",
                        "on-tertiary-container": "#8c70c2",
                        "on-tertiary": "#3b1f6d",
                        "on-surface": "#e2e2e2",
                        "on-tertiary-fixed-variant": "#523785",
                        "surface-container-low": "#1a1c1c",
                        "error-container": "#93000a",
                        "outline": "#958e98",
                        "primary-container": "#1c0a35",
                        "primary-fixed-dim": "#d4bdf2",
                        "secondary": "#ffffff",
                        "secondary-fixed-dim": "#dec800",
                        "on-surface-variant": "#cbc4cf",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed": "#fde400",
                        "secondary-container": "#fde400",
                        "tertiary-fixed-dim": "#d3bbff",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#ebddff",
                        "on-secondary-fixed-variant": "#504700",
                        "surface": "#121414",
                        "on-primary-container": "#8a76a7",
                        "on-primary": "#392853",
                        "inverse-primary": "#695684",
                        "on-primary-fixed": "#23123c",
                        "surface-tint": "#d4bdf2",
                        "primary": "#d4bdf2",
                        "tertiary-container": "#1d0048",
                        "on-tertiary-fixed": "#250158",
                        "surface-container-lowest": "#0c0f0f",
                        "inverse-on-surface": "#2f3131",
                        "on-background": "#e2e2e2",
                        "background": "#121414",
                        "on-error": "#690005",
                        "primary-fixed": "#eddcff",
                        "surface-dim": "#121414",
                        "on-primary-fixed-variant": "#503e6b",
                        "tertiary": "#d3bbff",
                        "surface-container": "#1e2020",
                        "on-secondary": "#373100",
                        "surface-container-highest": "#333535",
                        "inverse-surface": "#e2e2e2",
                        "surface-bright": "#37393a",
                        "surface-container-high": "#282a2b",
                        "outline-variant": "#4a454e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "gutter": "16px",
                        "section-gap": "64px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Montserrat"],
                        "label-caps": ["JetBrains Mono"],
                        "body-md": ["Work Sans"],
                        "body-lg": ["Work Sans"],
                        "headline-xl": ["Montserrat"],
                        "headline-lg": ["Montserrat"],
                        "headline-md": ["Montserrat"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["32px", { "lineHeight": "38px", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-xl": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .neon-glow {
            box-shadow: 0 0 20px rgba(253, 228, 0, 0.25);
        }
        .glass-card {
            background-color: rgba(38, 19, 66, 0.85); /* #261342 with 85% opacity */
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .deep-bg {
            background-color: #1C0A35;
        }
        @keyframes pulse-neon {
            0%, 100% { box-shadow: 0 0 10px rgba(253, 228, 0, 0.5), 0 0 20px rgba(253, 228, 0, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 20px rgba(253, 228, 0, 0.8), 0 0 40px rgba(253, 228, 0, 0.5); transform: scale(1.05); }
        }
        .pulse-active {
            animation: pulse-neon 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="deep-bg text-on-surface antialiased min-h-screen flex flex-col relative pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-md border-b border-white/10 transition-opacity duration-200 flat no shadows flex justify-between items-center px-container-margin h-16">
<button aria-label="Go Back" class="text-on-surface-variant hover:opacity-80 flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-secondary tracking-tighter italic">WKND</div>
<button aria-label="Notifications" class="text-on-surface-variant hover:opacity-80 flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="notifications" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<main class="flex-grow pt-24 px-container-margin md:px-section-gap flex flex-col gap-gutter max-w-4xl mx-auto w-full">
<!-- Header Info -->
<div class="flex justify-between items-end mb-4">
<div>
<h1 class="font-headline-md text-headline-md text-secondary">Live Order Tracking</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Order #8992-B</p>
</div>
<div class="text-right">
<p class="font-label-caps text-label-caps text-secondary-fixed mb-1">ETA</p>
<p class="font-headline-md text-headline-md text-secondary">15 MIN</p>
</div>
</div>
<!-- Stylized Map View -->
<div class="relative w-full h-[300px] md:h-[400px] rounded-xl overflow-hidden glass-card border border-white/10 flex items-center justify-center">
<!-- Simulated Map Background -->
<div class="absolute inset-0 bg-[#120624] opacity-50 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPPHBhdGggZD0iTTAgMGw0MCA0ME00MCAwbC00MCA0MCIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utb3BhY2l0eT0iLjA1Ii8+PC9zdmc+')]"></div>
<!-- Route Path -->
<svg class="absolute inset-0 w-full h-full" preserveaspectratio="none">
<path d="M 20% 80% Q 50% 80% 50% 50% T 80% 20%" fill="none" stroke="rgba(253, 228, 0, 0.3)" stroke-dasharray="10, 10" stroke-width="4"></path>
</svg>
<!-- Delivery Bike Icon (Moving) -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-secondary-fixed rounded-full flex items-center justify-center text-[#1C0A35] pulse-active z-10">
<span class="material-symbols-outlined" data-icon="two_wheeler" style="font-variation-settings: 'FILL' 1;">two_wheeler</span>
</div>
<!-- Destination House Icon -->
<div class="absolute right-[20%] top-[20%] -translate-x-1/2 -translate-y-1/2 w-10 h-10 bg-surface rounded-full flex items-center justify-center text-secondary border border-white/20 z-10">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
</div>
<!-- Delivery Partner Info Block -->
<div class="glass-card rounded-xl p-gutter mt-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-14 h-14 rounded-full bg-surface-container-high border-2 border-secondary-fixed overflow-hidden flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A detailed, realistic portrait of a delivery driver in a dark, neon-lit cyberpunk city setting. The driver is wearing a dark purple jacket with reflective yellow accents. The lighting is moody and dramatic, emphasizing the high-contrast vaporwave aesthetic of the app. The background is softly blurred to focus on the driver's face." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAoUILN58zHa_hUrNCBBJhY3dcyE_iXItal9PSqH91Ytvek0-4CRNdLJlWbNSuELZBRxZejnx_he6WPjDsI6UnoMgzEBd3mwmy9f08wAvQOxmm-FyFkOIIBMcNyCKdQ0OtCRBIDZu82uROsRFsU5UJLzXdFVx2dncw2Bapbpkf6Pv7FV14JfwVNmFwL_tQfr2K9h0UAiiZD_cVmVjdOkaDsBr6_JUtKSCZ8w69U4RBvaGAISKUmxfSUnw"/>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface-variant">Your driver</p>
<p class="font-headline-md text-[20px] leading-tight text-secondary font-semibold">Rahul</p>
</div>
</div>
<button class="bg-secondary-fixed text-on-secondary-fixed font-label-caps text-label-caps px-6 py-3 rounded-full flex items-center gap-2 hover:bg-secondary-fixed-dim transition-colors neon-glow">
<span class="material-symbols-outlined text-[18px]" data-icon="call" style="font-variation-settings: 'FILL' 1;">call</span>
                CALL
            </button>
</div>
<!-- Status Timeline -->
<div class="glass-card rounded-xl p-6 mt-4">
<h2 class="font-label-caps text-label-caps text-secondary mb-6 tracking-widest">ORDER STATUS</h2>
<div class="relative border-l-2 border-white/10 ml-3 space-y-8 pb-4">
<!-- Step 1: Received -->
<div class="relative flex items-start gap-6">
<div class="absolute -left-[13px] top-1 w-6 h-6 rounded-full bg-secondary-fixed flex items-center justify-center text-[#1C0A35]">
<span class="material-symbols-outlined text-[16px]" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-secondary font-medium">Order Received</p>
<p class="font-body-md text-body-md text-on-surface-variant/60 text-sm">10:42 PM</p>
</div>
</div>
<!-- Step 2: Preparing -->
<div class="relative flex items-start gap-6">
<div class="absolute -left-[13px] top-1 w-6 h-6 rounded-full bg-secondary-fixed flex items-center justify-center text-[#1C0A35]">
<span class="material-symbols-outlined text-[16px]" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-secondary font-medium">Preparing</p>
<p class="font-body-md text-body-md text-on-surface-variant/60 text-sm">10:45 PM</p>
</div>
</div>
<!-- Step 3: Out for Delivery (Active) -->
<div class="relative flex items-start gap-6">
<div class="absolute -left-[13px] top-1 w-6 h-6 rounded-full bg-surface border-2 border-secondary-fixed flex items-center justify-center z-10 pulse-active">
<div class="w-2 h-2 bg-secondary-fixed rounded-full"></div>
</div>
<div>
<p class="font-body-lg text-body-lg text-secondary-fixed font-bold">Out for Delivery</p>
<p class="font-body-md text-body-md text-secondary/80 text-sm">Rahul is on the way</p>
</div>
</div>
<!-- Step 4: Arrived (Pending) -->
<div class="relative flex items-start gap-6">
<div class="absolute -left-[13px] top-1 w-6 h-6 rounded-full bg-surface border-2 border-white/20 flex items-center justify-center">
</div>
<div class="opacity-40">
<p class="font-body-lg text-body-lg text-secondary font-medium">Arrived</p>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed due to linear/transactional nature of Live Tracking screen) -->
</body></html>
