<style>
        .glass-panel {

<body class="bg-[#1C0A35] text-on-surface min-h-screen flex flex-col items-center justify-center font-body-md">
<!-- Navigation Shell Suppressed as this is a transactional confirmation screen -->
<main class="w-full max-w-md px-container-margin py-section-gap flex flex-col items-center">
<!-- Success Icon -->
<div class="w-32 h-32 rounded-full glass-panel flex items-center justify-center mb-8 success-glow relative">
<div class="absolute inset-0 rounded-full border-2 border-emerald-400 opacity-50 animate-ping"></div>
<span class="material-symbols-outlined text-emerald-400" style="font-size: 64px; font-variation-settings: 'FILL' 1;">
                check_circle
            </span>
</div>
<!-- Header -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-secondary mb-4 text-center">
            Success!
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center mb-section-gap">
            Your midnight feast is on the way!
        </p>
<!-- Order Summary Card -->
<div class="w-full glass-panel rounded-xl p-6 mb-8 flex flex-col gap-6">
<div class="flex justify-between items-center border-b border-white/10 pb-4">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Order ID</span>
<span class="font-body-md text-body-md text-secondary font-medium">#8992-B</span>
</div>
<div class="flex justify-between items-center border-b border-white/10 pb-4">

                </span>
<span class="font-body-md text-body-md text-secondary-fixed font-bold tracking-wider">

                </span>
</div>

<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Total</span>
<span class="font-headline-md text-headline-md text-secondary">

                </span>
</div>
</div>

<button class="w-full bg-secondary-fixed text-on-secondary-fixed font-headline-md text-headline-md py-4 rounded-lg neon-glow transition-transform active:scale-95 flex items-center justify-center gap-2">
